[project]
name = "pulsarlm"
dynamic = ["version", "readme"]
description = "LLM inference engine with unbounded context."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=1.24.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
    "torch==2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "xdg-base-dirs>=6.0.2",
]

[project.scripts]
pulsarlm = "pulsarlm.cli:app"

[dependency-groups]
dev = [
    "hatchling",
]

[build-system]
requires = ["hatchling", "hatch-vcs", "editables", "torch==2.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/pulsarlm"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.force-include]
"../README.md" = "README.md"
"../pulsarlm-core/xmake.lua" = "pulsarlm-core/xmake.lua"
"../pulsarlm-core/inc" = "pulsarlm-core/inc"
"../pulsarlm-core/src" = "pulsarlm-core/src"
"../pulsarlm-core/tests" = "pulsarlm-core/tests"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "xmake.lua" },
    { file = "ext/**" },
    { file = "../pulsarlm-core/xmake.lua" },
    { file = "../pulsarlm-core/inc/**" },
    { file = "../pulsarlm-core/src/**" },
]

[tool.cibuildwheel]
build = "cp313-manylinux_* cp314-manylinux_*"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = "bash {package}/../.github/install_build_tools.sh"
environment = { PATH = "/usr/local/cuda-13.4/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/root/.local/bin:$PATH", XMAKE_ROOT = "y", PULSARLM_CUDA_ARCH = "sm_80,sm_86,sm_89,sm_90,sm_100,sm_120,compute_120" }
# torch and its CUDA runtime are loaded by `import torch` before the extension, so the wheel links them by soname.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude 'libtorch*.so' --exclude 'libc10*.so' --exclude libcudart.so.13 --exclude libnvrtc.so.13"
