[tool.uv.workspace]
members = ["pulsarlm"]

[dependency-groups]
dev = ["pulsarlm", "pytest", "ruff", "ty"]
benchmark = [
    "pulsarlm",
    "httpx",
    "matplotlib",
    "openai",
    "wonderwords",
    "mini-swe-agent==2.4.2",
    "mcp",
    "swebench==5.0.2",
    "scipy>=1.18.1",
]

[tool.uv.sources]
pulsarlm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["pulsarlm/tests"]
