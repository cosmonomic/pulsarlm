[tool.uv.workspace]
members = ["pulsarlm"]

[dependency-groups]
dev = ["pulsarlm", "pytest", "ruff", "ty"]
benchmark = [
    "pulsarlm",
    "httpx",
    "matplotlib",
    "openai",
    "wonderwords",
    "harbor>=0.25.0",
    "scipy>=1.18.1",
]

[tool.uv.sources]
pulsarlm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["pulsarlm/tests"]
