name: Build image

# The wheel build image: manylinux_2_34 with CUDA 13.2, gcc-toolset-15 and xmake
# (.github/build-image). Its tag is the git tree hash of .github/build-image, so
# an image is built and pushed once per content of that directory; publish.yml
# computes the same tag and waits for the image. A push to main that changes the
# directory builds it; a manual run builds the image of any ref, for publishing
# an older one.

on:
  push:
    branches: [main]
    paths:
      - .github/build-image/**
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit whose .github/build-image to build."
        required: true
        type: string

env:
  IMAGE: ghcr.io/cosmonomic/pulsarlm-build

jobs:
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to the GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image unless it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git rev-parse HEAD:.github/build-image)-${{ matrix.arch }}"
          image="$IMAGE:$tag"
          for attempt in 1 2 3; do
            if status=$(.github/image_status.sh cosmonomic/pulsarlm-build "$tag"); then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::could not tell whether $image exists"
              exit 1
            fi
            sleep 30
          done
          if [[ $status == exists ]]; then
            echo "$image exists"
            exit 0
          fi
          docker build --build-arg base=quay.io/pypa/manylinux_2_34_${{ matrix.arch }} -t "$image" .github/build-image
          docker push "$image"
