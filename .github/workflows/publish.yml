name: Publish to PyPI

# Triggers on a GitHub Release being published (not on tag push). The flow:
#   1. Push a tag (e.g. v0.1.0-alpha-1).
#   2. Create a Draft Release in the GitHub UI, attached to that tag.
#   3. Review the auto-generated notes; tick "pre-release" if appropriate.
#   4. Publish the release; this workflow then builds and uploads to PyPI.
#
# Authentication uses PyPI Trusted Publishers (OIDC), so there is no API token
# to manage. One-time setup on the PyPI side:
#   https://pypi.org/manage/account/publishing/ -> add a "pending" publisher with:
#     PyPI Project Name: pulsarlm
#     Owner:             cosmonomic
#     Repository name:   pulsarlm
#     Workflow name:     publish.yml
#     Environment name:  pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build and publish (e.g. v0.1.0-alpha-1)."
        required: true
        type: string

jobs:
  sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0  # hatch-vcs needs the tag, not just the commit

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build sdist
        run: uv build --sdist --package pulsarlm --out-dir dist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/

  wheel:
    strategy:
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
        python: [cp313, cp314]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0  # hatch-vcs needs the tag, not just the commit

      - name: Log in to the GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The image is built by build-image.yml, tagged with the tree hash of
      # .github/build-image; a release made right after changing that directory
      # waits for its build.
      - name: Wait for the build image
        id: build_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git rev-parse HEAD:.github/build-image)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          image="ghcr.io/cosmonomic/pulsarlm-build:$tag-${{ matrix.platform.arch }}"
          deadline=$((SECONDS + 1800))
          errors=0
          while true; do
            if status=$(.github/image_status.sh cosmonomic/pulsarlm-build "$tag-${{ matrix.platform.arch }}"); then
              if [[ $status == exists ]]; then
                break
              fi
              echo "$image does not exist yet"
            elif (( ++errors >= 3 )); then
              echo "::error::could not tell whether $image exists"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::$image does not exist; run the Build image workflow for this ref"
              exit 1
            fi
            sleep 60
          done

      - name: Free disk space and pull the build image
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL &
          docker pull "ghcr.io/cosmonomic/pulsarlm-build:${{ steps.build_image.outputs.tag }}-${{ matrix.platform.arch }}"
          wait
          df -h /

      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: pulsarlm
          output-dir: dist
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_${{ matrix.platform.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/cosmonomic/pulsarlm-build:${{ steps.build_image.outputs.tag }}-x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/cosmonomic/pulsarlm-build:${{ steps.build_image.outputs.tag }}-aarch64

      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: dist/

  publish:
    needs: [sdist, wheel]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/pulsarlm/
    permissions:
      id-token: write  # required for Trusted Publisher OIDC
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Verify the built version is not a development version
        run: |
          ls dist
          if ls dist | grep -E 'dev|\+'; then exit 1; fi

      - uses: pypa/gh-action-pypi-publish@release/v1
