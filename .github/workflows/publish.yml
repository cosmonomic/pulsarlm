name: Publish to PyPI

# Triggers on a GitHub Release being published (not on tag push). The flow:
#   1. Push a tag (e.g. v0.1.0-alpha-1).
#   2. Create a Draft Release in the GitHub UI, attached to that tag.
#   3. Review the auto-generated notes; tick "pre-release" if appropriate.
#   4. Publish the release; this workflow then builds and uploads to PyPI.
#
# Authentication uses PyPI Trusted Publishers (OIDC), so there is no API token
# to manage. One-time setup on the PyPI side:
#   https://pypi.org/manage/account/publishing/ -> add a "pending" publisher with:
#     PyPI Project Name: pulsarlm
#     Owner:             cosmonomic
#     Repository name:   pulsarlm
#     Workflow name:     publish.yml
#     Environment name:  pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build and publish (e.g. v0.1.0-alpha-1)."
        required: true
        type: string

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0  # hatch-vcs needs the tag, not just the commit

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build sdist
        run: uv build --sdist --package pulsarlm --out-dir dist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/

  wheel:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0  # hatch-vcs needs the tag, not just the commit

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build wheel
        run: docker run --rm -v "$PWD:/io" quay.io/pypa/manylinux_2_34_${{ matrix.arch }} bash /io/.github/build_wheel.sh

      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/

  publish:
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pulsarlm/
    permissions:
      id-token: write  # required for Trusted Publisher OIDC
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Verify the built version is not a development version
        run: |
          ls dist
          if ls dist | grep -E 'dev|\+'; then exit 1; fi

      - uses: pypa/gh-action-pypi-publish@release/v1
